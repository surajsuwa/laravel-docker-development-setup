services:
    # =================================
    # PHP / LARAVEL
    # =================================
    app:
        build:
            context: .
            dockerfile: docker/php/Dockerfile
            target: development

        container_name: laravel_app

        working_dir: /var/www/html

        volumes:
            - .:/var/www/html
            - vendor_data:/var/www/html/vendor

        environment:
            APP_ENV: local
            DB_CONNECTION: mysql
            DB_HOST: mysql
            DB_PORT: 3306
            REDIS_HOST: redis

        depends_on:
            mysql:
                condition: service_healthy
            redis:
                condition: service_healthy

        restart: unless-stopped

        networks:
            - laravel_network

    # =================================
    # NGINX
    # =================================
    nginx:
        image: nginx:alpine

        container_name: laravel_nginx

        ports:
            - "8000:80"

        volumes:
            - .:/var/www/html:ro
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

        depends_on:
            - app

        restart: unless-stopped

        networks:
            - laravel_network

    # =================================
    # MYSQL
    # =================================
    mysql:
        image: mysql:8.0

        container_name: laravel_mysql

        environment:
            MYSQL_DATABASE: ${DB_DATABASE:-news-blog}
            MYSQL_USER: ${DB_USERNAME:-laravel}
            MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
            MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}

        ports:
            - "3306:3306"

        volumes:
            - mysql_data:/var/lib/mysql

        healthcheck:
            test:
                - CMD-SHELL
                - mysqladmin ping -h localhost -uroot -p"$${MYSQL_ROOT_PASSWORD}" --silent

            interval: 10s
            timeout: 5s
            retries: 10

        restart: unless-stopped

        networks:
            - laravel_network

    # =================================
    # PHPMYADMIN
    # =================================
    phpmyadmin:
        image: phpmyadmin:latest

        container_name: laravel_phpmyadmin

        ports:
            - "8080:80"

        environment:
            PMA_HOST: mysql
            PMA_PORT: 3306

        depends_on:
            mysql:
                condition: service_healthy

        restart: unless-stopped

        networks:
            - laravel_network

    # =================================
    # REDIS
    # =================================
    redis:
        image: redis:7-alpine

        container_name: laravel_redis

        volumes:
            - redis_data:/data

        healthcheck:
            test: ["CMD", "redis-cli", "ping"]

            interval: 10s
            timeout: 5s
            retries: 5

        restart: unless-stopped

        networks:
            - laravel_network

    # =================================
    # QUEUE WORKER
    # =================================
    queue:
        build:
            context: .
            dockerfile: docker/php/Dockerfile
            target: development

        working_dir: /var/www/html

        command: php artisan queue:work redis --sleep=3 --tries=3 --timeout=90

        volumes:
            - .:/var/www/html
            - vendor_data:/var/www/html/vendor

        environment:
            APP_ENV: local
            DB_HOST: mysql
            REDIS_HOST: redis

        depends_on:
            mysql:
                condition: service_healthy
            redis:
                condition: service_healthy

        restart: unless-stopped

        networks:
            - laravel_network

    # =================================
    # SCHEDULER
    # =================================
    scheduler:
        build:
            context: .
            dockerfile: docker/php/Dockerfile
            target: development

        working_dir: /var/www/html

        command: >
            sh -c "while true; do
            php artisan schedule:run --verbose --no-interaction;
            sleep 60;
            done"

        volumes:
            - .:/var/www/html
            - vendor_data:/var/www/html/vendor

        environment:
            APP_ENV: local
            DB_HOST: mysql
            REDIS_HOST: redis

        depends_on:
            mysql:
                condition: service_healthy
            redis:
                condition: service_healthy

        restart: unless-stopped

        networks:
            - laravel_network

# =================================
# VOLUMES
# =================================
volumes:
    mysql_data:
    redis_data:
    vendor_data:

# =================================
# NETWORKS
# =================================
networks:
    laravel_network:
        driver: bridge
